name: Build data tiles

# Runs the full OSM → PMTiles pipeline on a GitHub-hosted runner.
# Manual trigger ("Run workflow" button on the Actions tab) + monthly cron.
# Publishes europe-run.pmtiles to a GitHub Release (tag: data-YYYY-MM-DD).

on:
  workflow_dispatch:
  schedule:
    # 04:23 UTC on the 1st of each month. Offset from the hour to be polite.
    - cron: "23 4 1 * *"

permissions:
  contents: write  # needed to create/upload releases

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Default GH runners have ~14 GB free disk. europe-latest.osm.pbf is ~30 GB.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Install system tools (osmium, tippecanoe)
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool tippecanoe

      - name: Install go-pmtiles CLI
        run: |
          VERSION="1.22.2"
          curl -fsSL -o pmtiles.tar.gz \
            "https://github.com/protomaps/go-pmtiles/releases/download/v${VERSION}/go-pmtiles_${VERSION}_Linux_x86_64.tar.gz"
          tar xzf pmtiles.tar.gz pmtiles
          sudo mv pmtiles /usr/local/bin/pmtiles
          pmtiles version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm deps
        run: npm ci

      - name: Run interpreter tests (fail fast)
        run: npm test

      - name: Show free disk before build
        run: df -h /

      - name: Fetch OSM extract
        run: npm run data:fetch

      - name: Filter to relevant tags
        run: npm run data:filter

      - name: Free the raw PBF (not needed from here on)
        run: |
          rm -f data/europe-latest.osm.pbf data/europe-latest.osm.pbf.md5 data/europe-latest.osm.pbf.md5.raw
          df -h /

      - name: Check filtered PBF
        run: |
          ls -lh data/europe-filtered.osm.pbf
          echo "--- osmium fileinfo ---"
          osmium fileinfo -e data/europe-filtered.osm.pbf || true

      - name: Export filtered PBF to GeoJSONSeq
        run: |
          osmium export data/europe-filtered.osm.pbf -f geojsonseq \
            --add-unique-id=type_id \
            -o data/europe-raw.geojsonseq --overwrite
          echo "Raw GeoJSONSeq size:"
          ls -lh data/europe-raw.geojsonseq
          echo "First 3 lines:"
          head -3 data/europe-raw.geojsonseq || true
          echo "Line count:"
          wc -l < data/europe-raw.geojsonseq

      - name: Normalize tags
        run: |
          npx tsx packages/tile-builder/src/normalize.ts \
            < data/europe-raw.geojsonseq \
            > data/europe-enriched.geojsonseq
          echo "Enriched GeoJSONSeq size:"
          ls -lh data/europe-enriched.geojsonseq
          echo "First 3 lines:"
          head -3 data/europe-enriched.geojsonseq || true
          echo "Line count:"
          wc -l < data/europe-enriched.geojsonseq

      - name: Clean up raw export (save disk)
        run: rm -f data/europe-raw.geojsonseq data/europe-filtered.osm.pbf

      - name: Build tiles (tippecanoe + pmtiles)
        run: |
          # --no-tile-size-limit: keep EVERY feature (no density dropping). The
          # full European pedestrian network is ~94M features / ~6.8 GB geometry,
          # which cannot fit a 2 GB GitHub-release asset — the resulting PMTiles
          # is hosted on Cloudflare R2 instead (see docs/HOSTING.md).
          # maxzoom z12 (browser overzooms for close-up) keeps the file safely
          # inside R2's free 10 GB tier (~2-3 GB); low zooms stay small via
          # per-feature tippecanoe.minzoom (normalize.ts). A hard size guard
          # below aborts the R2 upload if the file ever exceeds the cap.
          tippecanoe --force --layer=run \
            --minimum-zoom=6 --maximum-zoom=12 \
            --no-tile-size-limit \
            --simplification=10 \
            --read-parallel \
            --attribute-type=osm_id:int \
            -o data/europe-run.mbtiles data/europe-enriched.geojsonseq
          pmtiles convert --force data/europe-run.mbtiles data/europe-run.pmtiles
          rm -f data/europe-run.mbtiles data/europe-enriched.geojsonseq

      # Convert Geofabrik's europe.poly (the exact source-extract extent)
      # into a GeoJSON MultiPolygon. The web app draws it as a dashed outline
      # so users can see where data coverage ends.
      - name: Generate Europe extent GeoJSON
        run: |
          curl -fsSL -o data/europe.poly https://download.geofabrik.de/europe.poly
          node -e '
            const fs = require("fs");
            const lines = fs.readFileSync("data/europe.poly", "utf8").split(/\r?\n/);
            const polys = [];
            let inSection = false, isHole = false, pts = [], headerSeen = false;
            for (const raw of lines) {
              const line = raw.trim();
              if (!line) continue;
              if (!headerSeen && !inSection) { headerSeen = true; continue; }
              if (line === "END") {
                if (inSection) {
                  if (pts.length) {
                    const ring = (pts[0][0] === pts[pts.length-1][0] && pts[0][1] === pts[pts.length-1][1]) ? pts : [...pts, pts[0]];
                    if (isHole) { if (polys.length) polys[polys.length-1].holes.push(ring); }
                    else { polys.push({ outer: ring, holes: [] }); }
                  }
                  inSection = false; pts = [];
                }
                continue;
              }
              if (!inSection) { inSection = true; isHole = line.startsWith("!"); pts = []; continue; }
              const m = line.split(/\s+/).map(Number);
              if (m.length >= 2 && Number.isFinite(m[0]) && Number.isFinite(m[1])) pts.push([m[0], m[1]]);
            }
            const coordinates = polys.map(p => [p.outer, ...p.holes]);
            const geo = { type: "Feature", properties: { name: "Europe (Geofabrik extract extent)" }, geometry: { type: "MultiPolygon", coordinates } };
            fs.writeFileSync("data/europe-extent.geojson", JSON.stringify(geo));
            console.log("polygons:", polys.length, "outer points:", polys[0]?.outer.length);
          '
          ls -lh data/europe-extent.geojson

      - name: Report artifact size
        run: ls -lh data/europe-run.pmtiles data/europe-extent.geojson

      # Hard guard: never upload something that would blow R2's free 10 GB tier.
      # Cap defaults to 9 GB (margin under 10). If exceeded, fail loudly so we
      # rebuild with a lower maxzoom / higher per-feature minzoom.
      - name: Guard PMTiles size (R2 free-tier budget)
        env:
          R2_MAX_BYTES: ${{ vars.R2_MAX_BYTES || '9000000000' }}
        run: |
          SIZE=$(stat -c %s data/europe-run.pmtiles)
          echo "europe-run.pmtiles = $SIZE bytes (cap $R2_MAX_BYTES)"
          if [[ "$SIZE" -gt "$R2_MAX_BYTES" ]]; then
            echo "::error::PMTiles ($SIZE bytes) exceeds the R2 budget ($R2_MAX_BYTES). Lower maximum-zoom or raise per-feature minzoom in normalize.ts, then rebuild. NOT uploading."
            exit 1
          fi

      # The full PMTiles (~GBs) exceeds GitHub's 2 GB release-asset limit, so it
      # is uploaded to Cloudflare R2 (S3-compatible; aws-cli is preinstalled on
      # the runner). Requires repo secrets R2_ACCOUNT_ID / R2_ACCESS_KEY_ID /
      # R2_SECRET_ACCESS_KEY / R2_BUCKET — see docs/HOSTING.md. If they are not
      # set yet, this step is skipped (the build still produces the extent).
      - name: Upload PMTiles to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # Newer aws-cli v2 sends checksums R2 rejects; only send when required.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          if [[ -z "$R2_ACCOUNT_ID" || -z "$R2_BUCKET" || -z "$AWS_ACCESS_KEY_ID" ]]; then
            echo "::warning::R2 secrets not set — skipping PMTiles upload. See docs/HOSTING.md."
            exit 0
          fi
          aws s3 cp data/europe-run.pmtiles "s3://${R2_BUCKET}/europe-run.pmtiles" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type application/octet-stream \
            --no-progress
          echo "Uploaded europe-run.pmtiles to R2 bucket ${R2_BUCKET}."

      # Publish ONLY the tiny extent + date marker to a GitHub Release. The web
      # app reads the release tag for the data date and downloads the extent;
      # the big PMTiles comes from R2.
      - name: Publish extent + version to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="data-$(date +%Y-%m-%d)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" data/europe-extent.geojson --clobber
          else
            gh release create "$TAG" \
              --title "Data snapshot $TAG" \
              --notes "PMTiles running overlay built from europe-latest.osm.pbf on $(date -u +%Y-%m-%dT%H:%M:%SZ). Tiles hosted on Cloudflare R2." \
              data/europe-extent.geojson
          fi
